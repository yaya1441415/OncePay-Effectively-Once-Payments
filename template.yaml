AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Level 3 - idempotent payment processor

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TRANSACTIONS_TABLE: !Ref TransactionsTable
        ACCOUNTS_TABLE: !Ref AccountsTable
        NODE_OPTIONS: --enable-source-maps
        LEDGER_TABLE: !Ref LedgerTable
Resources:
  ProcessTransactionFunction:
    Type: AWS::Serverless::Function
    Metadata: #sam uses it 
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [processor/process-transaction.ts]
        Target: es2022
        Format: cjs
        Minify: false
        Sourcemap: true
    Properties:
      CodeUri: src/
      Handler: process-transaction.handler
      Policies:
        - Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: [!GetAtt TransactionsTable.Arn, !GetAtt AccountsTable.Arn]
          - Effect: Allow
            Action: [dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
            Resource: [!GetAtt TransactionsTable.Arn, !GetAtt AccountsTable.Arn]
          - Effect: Allow
            Action: dynamodb:PutItem
            Resource: !GetAtt LedgerTable.Arn
          - Effect: Allow
            Action: [kms:Decrypt, kms:DescribeKey, kms:GenerateDataKey]
            Resource: !GetAtt DataKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: #limits how your lambda's role is allowed to use the KMS key
                  - !Sub dynamodb.${AWS::Region}.amazonaws.com
                  - !Sub sqs.${AWS::Region}.amazonaws.com
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt TransactionsQueue.Arn #WHich queue to read from
            BatchSize: 10  #up to 10 messages per invocation
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: 
              MaximumConcurrency: 2  #at most 2 copies of the functionat once
  TransactionsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !Ref DataKey
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600
  OutboxPipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com # only the EventBridge Pipes service can use this role
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId 
      Policies:
        - PolicyName: outbox-pipe
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt TransactionsTable.StreamArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt TransactionsQueue.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt DataKey.Arn
                Condition: 
                  StringEquals:
                    kms:ViaService: #key must be used only when the request comes through sqs or dynamodb
                      - !Sub dynamodb.${AWS::Region}.amazonaws.com
                      - !Sub sqs.${AWS::Region}.amazonaws.com
  OutboxPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      RoleArn: !GetAtt OutboxPipeRole.Arn
      Source: !GetAtt TransactionsTable.StreamArn #where data omes from
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
        FilterCriteria:
          Filters: #only care about records with:
            - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"NewImage": {"status": {"S": ["PENDING"]}}}}'
      Target: !GetAtt TransactionsQueue.Arn
      TargetParameters:
        InputTemplate: '{"transactionId": "<$.dynamodb.NewImage.transactionId.S>"}'
  TransactionsQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !Ref DataKey #encrypts messages wth your key
      KmsDataKeyReusePeriodSeconds: 300 #sqs reuse key for 5 minlow cost
      MessageRetentionPeriod: 1209600 #keeps unprocessed mssg for 14 days.
      VisibilityTimeout: 60 #how long message stays hidden after read
      ReceiveMessageWaitTimeSeconds: 20 #Long Polling
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TransactionsDLQ.Arn
        maxReceiveCount: 5
  GetTransactionFunction:
    Type: AWS::Serverless::Function
    Metadata:  #how to build 
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/get-transaction.ts]
        Target: es2022
        Format: cjs
        Minify: false
        Sourcemap: true
    Properties:
      CodeUri: src/
      Handler: get-transaction.handler
      Policies:
        - Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt TransactionsTable.Arn
          - Effect: Allow
            Action: [kms:Decrypt, kms:DescribeKey]
            Resource: !GetAtt DataKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com
      Events:
        GetTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref PaymentsApi
            Path: /transactions/{id}
            Method: get
  CreateTransactionFunction:
    Type: AWS::Serverless::Function
    Metadata: #tells sam to compile ts to js
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/create-transaction.ts]
        Target: es2022
        Format: cjs
        Minify: false
        Sourcemap: true
    Properties:
      CodeUri: src/
      Handler: create-transaction.handler
      Policies:
        - Statement:
          - Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:GetItem]
            Resource: !GetAtt TransactionsTable.Arn
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt AccountsTable.Arn
          - Effect: Allow
            Action: [kms:Decrypt, kms:DescribeKey]
            Resource: !GetAtt DataKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com
      Events:
        CreateTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref PaymentsApi
            Path: /transactions
            Method: post
            RequestParameters:
              - method.request.header.Idempotency-Key:
                  Required: true
            RequestModel:
              Model: transferRequest
              Required: true
              ValidateBody: true
              ValidateParameters: true
  PaymentsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev 
      Auth:
        DefaultAuthorizer: CognitoAuth # who is allowed in?
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn #tokens are valid if they come from this pool 
            AuthorizationScopes:
              - aws.cognito.signin.user.admin
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
      Models:
        transferRequest:
          type: object
          required: [fromAccountId, toAccountId, amountCents]
          additionalProperties: false
          properties:
            fromAccountId:
              type: string
              minLength: 1
              maxLength: 64 
            toAccountId:  
              type: string 
              minLength: 1 
              maxLength: 64 
            amountCents: 
              type: integer
              minimum: 1
              maximum: 1000000 
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts payment data at rest
      EnableKeyRotation: true
      PendingWindowInDays: 7 # if someone delete this, wait 7 days
      KeyPolicy:  #who may use or manage this key 
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountIamPolicies #statement ID
            Effect: Allow
            Principal: 
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'   
  DataKeyAlias: 
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/payments-data #always start with alias
      TargetKeyId: !Ref DataKey
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      StreamSpecification:
        StreamViewType: NEW_IMAGE #each record conatins the item as it is after teh change
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: openShard
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OpenTransactions
          KeySchema:
            - AttributeName: openShard
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection: # wich attributes gets copied into th index
            ProjectionType: ALL
      SSESpecification: # SSE serverside encryption, encrypts the data at rest using kms key
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByOwner
          KeySchema:
            - AttributeName: ownerId        
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification: # SSE serverside encryption, encrypts the data at rest using kms key
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: entryId
          AttributeType: S
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: postedAt
          AttributeType: S
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
        - AttributeName: entryId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByAccount
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
            - AttributeName: postedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification: # SSE serverside encryption, encrypts the data at rest using kms key
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  ProcessedEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true   
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true #nobody can sign themself up only admin creates user 
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: payments-api-client
      GenerateSecret: false
      ExplicitAuthFlows: # list way app is allowed to log in
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH #SECURE REMOTE PASSWORD
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
Outputs:
  TransactionsTableName:
    Value: !Ref TransactionsTable
  AccountsTableName:
    Value: !Ref AccountsTable
  LedgerTableName:
    Value: !Ref LedgerTable
  ProcessedEventsTableName:
    Value: !Ref ProcessedEventsTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiUrl:
    Value: !Sub https://${PaymentsApi}.execute-api.${AWS::Region}.amazonaws.com/dev
  TransactionsQueueUrl:
    Value: !Ref TransactionsQueue